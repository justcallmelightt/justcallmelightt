name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-profile-art.yml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install renderer dependencies
        run: python -m pip install --requirement scripts/requirements.txt

      - name: Refresh contribution data
        run: python scripts/fetch_contributions.py
        env:
          GITHUB_USERNAME: justcallmelightt

      - name: Render contribution artwork
        run: python scripts/render_heatmap_svg.py

      - name: Commit refreshed artwork
        shell: bash
        run: |
          if git diff --quiet -- data/contributions.json contrib-heatmap.svg; then
            echo "Contribution artwork is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          git commit -m "chore: refresh contribution graph [skip ci]"
          git push
